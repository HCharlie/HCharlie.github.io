<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HCharlie</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --fg: #e7ecf3;
      --muted: #8b98a5;
      --accent: #1d9bf0;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f9fc;
        --fg: #0f1419;
        --muted: #536471;
        --accent: #1a8cd8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
    }
    main {
      max-width: 32rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    code {
      font-size: 0.9em;
      padding: 0.15em 0.4em;
      border-radius: 4px;
      background: color-mix(in srgb, var(--fg) 8%, transparent);
    }
  </style>
</head>
<body>
  <main>
    <h1>HCharlie</h1>
    <p>Personal site on GitHub Pages. Edit <code>index.html</code> and push to update.</p>
    <p style="margin-top: 1.25rem;">
      <a href="https://github.com/HCharlie">GitHub profile</a>
      ·
      <a href="https://github.com/HCharlie/HCharlie.github.io">This repo</a>
    </p>
  </main>
</body>
</html>
